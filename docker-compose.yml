version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smartflow_postgres
    environment:
      POSTGRES_USER: smartflow
      POSTGRES_PASSWORD: smartflow_secure_password
      POSTGRES_DB: smartflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - smartflow_net

  redis:
    image: redis:7-alpine
    container_name: smartflow_redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - smartflow_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartflow_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://smartflow:smartflow_secure_password@postgres:5432/smartflow
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=smartflow_production_secret_key_2024_secure
      - JWT_SECRET_KEY=smartflow_jwt_secret_key_production_token
      - LOCAL_STORAGE_PATH=/app/uploads
      - CORS_ORIGINS=http://localhost:3000,http://web:3000
    volumes:
      - api_uploads:/app/uploads
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - smartflow_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartflow_worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://smartflow:smartflow_secure_password@postgres:5432/smartflow
      - REDIS_URL=redis://redis:6379/0
      - LOCAL_STORAGE_PATH=/app/uploads
    volumes:
      - api_uploads:/app/uploads
    restart: unless-stopped
    networks:
      - smartflow_net

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartflow_web
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:5000/api/v1
      - NODE_ENV=production
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - smartflow_net

volumes:
  postgres_data:
  redis_data:
  api_uploads:

networks:
  smartflow_net:
    driver: bridge
